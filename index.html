<title>Agency Gloria</title>
<style>

  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: #ffffff; color: var(--ink); font: 400 14px/1.45 "Pragmatica", "Helvetica Neue", Helvetica, Arial, sans-serif; }

  input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { min-height: 48px; border: 0; border-radius: 2px; background: var(--ink); color: #ffffff; font: inherit; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; cursor: pointer; }
  button[disabled] { opacity: 0.55; cursor: default; }
  .error { min-height: 20px; margin: 0; color: var(--danger); font-size: 13px; }
  .opening { margin: 0; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; }
  [hidden] { display: none !important; }
</style>

  <p class="opening" id="opening" hidden>Opening…</p>
  <form id="login" hidden>
    <label>Email<input type="email" name="email" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="error" id="error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<script>
(() => {
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbw1IYXxwZYWr_mE5fRdsQdCliPUrVd4T3KTGWmwJ2VrQLYBb_t3yD0KtAkDRG0NX-8_1g/exec";
  const form = document.getElementById("login");
  const opening = document.getElementById("opening");
  const error = document.getElementById("error");

  async function call(action, body) {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, ...body }),
    });
    return res.json();
  }

  function showForm(message = "") {
    opening.hidden = true;
    form.hidden = false;
    error.textContent = message;
    form.elements.email.focus();
  }

  async function openStudio(token) {
    form.hidden = true;
    opening.hidden = false;
    let out;
    try {
      out = await call("app", { token });
    } catch (e) {
      showForm("Could not reach the server. Try again in a moment.");
      return;
    }
    if (!out.html) {
      localStorage.removeItem("ag-token");
      showForm();
      return;
    }
    localStorage.setItem("ag-endpoint", ENDPOINT);
    document.open();
    document.write(out.html);
    document.close();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    error.textContent = "";
    try {
      const out = await call("login", { email: form.elements.email.value, password: form.elements.password.value });
      if (!out.token) { showForm(out.error || "Could not sign in."); return; }
      localStorage.setItem("ag-token", out.token);
      localStorage.setItem("ag-role", out.user.role);
      localStorage.setItem("ag-user-id", out.user.id);
      await openStudio(out.token);
    } catch (e) {
      showForm("Could not reach the server. Try again in a moment.");
    } finally {
      button.disabled = false;
    }
  });

  const saved = localStorage.getItem("ag-token");
  if (saved) openStudio(saved); else showForm();
})();
</script>
